name: Install mcp-publisher
description: >
  Downloads the pinned mcp-publisher release for linux/amd64, checks its
  SHA-256 and extracts the binary to $RUNNER_TEMP/mcp-publisher.

runs:
  using: composite
  steps:
    - name: Download, verify and extract mcp-publisher
      shell: bash
      env:
        # mcp-publisher release used to validate and publish server.json, and
        # the SHA-256 of its mcp-publisher_linux_amd64.tar.gz asset.
        MCP_PUBLISHER_VERSION: v1.8.7
        MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
        echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
