version: 2
updates:
  # Bumps the SHA-pinned GitHub Actions (and their "# vX" comments).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only versions released at least 14 days ago; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Only versions released at least 14 days ago; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
