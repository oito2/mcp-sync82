name: Release

# Publishes one raw binary per platform, named sync82_<goos>_<goarch>
# (".exe" on Windows), the sync82.mcpb Claude Desktop bundle, a
# checksums.txt over all of them, a keyless Sigstore bundle signing
# checksums.txt, and the MCP Registry server.json. Asset names carry no
# version, so releases/latest/download/<name> always points at the newest
# release. Every asset is built by `go run ./scripts/release <tag>`; GitHub
# build provenance attestations cover the binaries and the bundle, and the
# publish-registry job then publishes server.json to the MCP Registry.

on:
  push:
    tags:
      - "v*"

# Read-only by default (least privilege) — each job below that needs more
# (the release itself, attestations, OIDC) declares it.
permissions:
  contents: read

# mcp-publisher release used to validate and publish server.json, and the
# SHA-256 of its mcp-publisher_linux_amd64.tar.gz asset.
env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  # golangci-lint release the checks job runs.
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  # GITHUB_REF_NAME becomes part of a shell string (-ldflags), so its format
  # is validated once, up front, rather than trusting the "v*" trigger glob
  # (which only checks the prefix, not the full vMAJOR.MINOR.PATCH shape).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi

  # Runs the same checks as CI against the tagged commit, so a tag on a
  # failing commit never produces a release.
  checks:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps never push, so the token isn't left in .git/config

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true # newest 1.26.x patch, not an older one cached on the runner
          cache: false # never restore module/build caches saved by other workflow runs into a release

      - name: Format check
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Builds every artifact in one job: the .mcpb bundle needs all the
  # binaries (it merges the two darwin ones into a universal binary), and
  # cross-compiling with CGO_ENABLED=0 gives the same output on any runner,
  # so a per-target build matrix would only add artifact round-trips.
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job publishes the release
      id-token: write # GitHub OIDC token for cosign's keyless signing and the build provenance attestation
      attestations: write # stores the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps never push, so the token isn't left in .git/config

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false # the signed binaries are built from a clean cache only

      # Writes the binaries, sync82.mcpb, checksums.txt (bare file names,
      # the format self-update parses) and server.json into dist/.
      - name: Build release artifacts
        run: go run ./scripts/release "${GITHUB_REF_NAME}"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      # An invalid server.json fails the job before any release exists.
      - name: Validate server.json against the MCP Registry schema
        working-directory: dist
        run: '"$RUNNER_TEMP/mcp-publisher" validate'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6" # pinned so an installer update cannot change the signing flags

      # Signs checksums.txt, which covers every binary and the bundle, into
      # a single Sigstore bundle. Verify with:
      #   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/oito2/mcp-sync82/\.github/workflows/release\.yml@refs/tags/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign checksums.txt (keyless, Sigstore bundle)
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      # Records SLSA build provenance for each binary and the bundle.
      # Verify a downloaded asset with:
      #   gh attestation verify <file> --repo oito2/mcp-sync82
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/sync82_*
            dist/sync82.mcpb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # Publishes the server.json attached to the release, so its fileSha256 is
  # the checksum of the sync82.mcpb asset users download. A separate job, so
  # a failed publish can be re-run without re-creating the release.
  publish-registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    steps:
      - name: Download server.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern server.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Authenticate to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
